services:
  - type: worker
    name: crypto-signal-bot
    env: python
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
      python -c "import easyocr; reader = easyocr.Reader(['en'], gpu=False, model_storage_directory='/tmp/easyocr_models')"
    startCommand: python main.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: SUBSCRIPTION_PRICE
        value: "25"
      - key: SUPPORT_ID
        value: "your_support_username"
      - key: CHANNEL_ID
        value: "@your_private_channel"
      - key: CURRENCY
        value: "USDT"
      - key: ADMIN_ID
        value: "123456789"
      - key: PYTHONUNBUFFERED
        value: "1"
    disk:
      name: easyocr-models
      mountPath: /tmp/easyocr_models
      sizeGB: 2
